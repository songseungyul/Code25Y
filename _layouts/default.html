<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ko-KR' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}" />
    <script>
      (function () {
        var savedTheme = localStorage.getItem('theme');
        var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    {% seo %}
    {%- feed_meta -%}
  </head>
  <body>
    <a class="skip-link" href="#main">본문 바로가기</a>
    <header class="site-header">
      <div class="container header-row">
        <div class="brand-group">
          <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
          <p class="brand-tagline">배움은 지나가도 기록은 남습니다</p>
        </div>
        <nav class="nav-links" aria-label="주 메뉴">
          <a href="{{ '/' | relative_url }}">홈</a>
          <a href="{{ '/about/' | relative_url }}">소개</a>
          <a href="{{ '/search/' | relative_url }}">검색</a>
          <a href="{{ '/tags/' | relative_url }}">태그</a>
          <a href="{{ '/feed.xml' | relative_url }}" aria-label="RSS 피드">RSS</a>
          <a href="https://github.com/songseungyul/Code25Y">GitHub</a>
          <button class="theme-toggle" type="button" aria-label="다크 모드로 전환" aria-pressed="false" title="다크 모드로 전환">🌙</button>
        </nav>
      </div>
    </header>

    <main id="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <p>{{ site.title }} · 다시 꺼내 볼 수 있는 공부 기록을 남깁니다.</p>
        <p><a href="https://github.com/songseungyul">GitHub</a></p>
      </div>
    </footer>
    <script>
      (function () {
        var root = document.documentElement;
        var toggle = document.querySelector('.theme-toggle');
        if (!toggle) return;

        function applyTheme(theme) {
          root.setAttribute('data-theme', theme);
          var isDark = theme === 'dark';
          toggle.setAttribute('aria-pressed', String(isDark));
          toggle.setAttribute('aria-label', isDark ? '라이트 모드로 전환' : '다크 모드로 전환');
          toggle.setAttribute('title', isDark ? '라이트 모드로 전환' : '다크 모드로 전환');
          toggle.textContent = isDark ? '☀️' : '🌙';
        }

        var savedTheme = localStorage.getItem('theme');
        var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        var initialTheme = savedTheme || (systemPrefersDark.matches ? 'dark' : 'light');
        applyTheme(initialTheme);

        toggle.addEventListener('click', function () {
          var nextTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          localStorage.setItem('theme', nextTheme);
          applyTheme(nextTheme);
        });

        systemPrefersDark.addEventListener('change', function (event) {
          if (localStorage.getItem('theme')) return;
          applyTheme(event.matches ? 'dark' : 'light');
        });
      })();
    </script>
    <script>
      (function () {
        var images = document.querySelectorAll('.prose img, .profile-image');
        images.forEach(function (img) {
          if (!img.hasAttribute('loading')) img.setAttribute('loading', 'lazy');
          if (!img.hasAttribute('decoding')) img.setAttribute('decoding', 'async');
        });
      })();
    </script>
  </body>
</html>
