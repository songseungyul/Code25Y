title: Code25Y
author: Song seung yul
email: thinkdiff@uuh.ulsan.kr
description: >-
  배움은 지나가도 기록은 남습니다. 공부한 것과 앞으로 공부할 것을 마크다운으로 정리하는 개인 학습 블로그.
baseurl: "/Code25Y"
url: "https://songseungyul.github.io"
lang: ko-KR
timezone: Asia/Seoul
theme: minima
markdown: kramdown
kramdown:
  toc_levels: "2..3"
  auto_ids: true
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
minima:
  skin: auto

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - post-template.md
  - vendor
  - .bundle
  - node_modules

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
