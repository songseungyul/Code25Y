title: Code25Y
author: Song seung yul
email: thinkdiff@uuh.ulsan.kr
description: >-
  대학병원 IT에서 26년. 공부한 것을 기록하고, 그 시간이 다음 20년에 무엇이 되는지 묻습니다.
baseurl: "/Code25Y"
url: "https://songseungyul.github.io"
lang: ko-KR
timezone: Asia/Seoul
theme: minima
markdown: kramdown
kramdown:
  toc_levels: "2..3"
  auto_ids: true
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
minima:
  skin: auto

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - post-template.md
  - vendor
  - .bundle
  - node_modules

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
